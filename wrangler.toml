name = "auth-techimpossible"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
account_id = "df6bf0a4f7b939cfb3377af46ed698c8"
workers_dev = true
preview_urls = false

# Custom-domain route binding to auth.techimpossible.com must be created
# manually via the Cloudflare dashboard. The CF API token in `~/.bashrc` has
# scopes for KV, DNS, Workers Scripts, and Workers Secrets, but is missing the
# zone-level "Workers Routes" scope, so wrangler cannot create the route here.
#
# Once the route exists (one click in the dashboard, or `Cloudflare Dashboard
#   → Workers & Pages → auth-techimpossible → Settings → Domains & Routes →
#   Add Route → "auth.techimpossible.com/*" on zone techimpossible.com`),
# uncomment the block below and set `workers_dev = false`, then redeploy.
#
# [[routes]]
# pattern = "auth.techimpossible.com/*"
# zone_name = "techimpossible.com"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "a9b6d5c2c4bc48b38742457a95987d54"

[[kv_namespaces]]
binding = "ALLOWLIST_KV"
id = "8534f8bb22f34fefbfe78fa93459b536"

[[kv_namespaces]]
binding = "TENANT_KV"
id = "ab54772eb60f4807a040d76c958a8645"

[vars]
GOOGLE_OIDC_CLIENT_ID = "150639949574-onkaavrc88u243l0ipj15r7t68sio0s5.apps.googleusercontent.com"
ISSUER = "https://auth.techimpossible.com"
ALLOWED_ADMIN_EMAILS = "peter.skaronis@techimpossible.com"

# Client ID Metadata Document allowlist: whitespace/comma separated, exact
# https client_id URLs. Resolving a CIMD client_id costs an outbound fetch and a
# KV write driven by an UNAUTHENTICATED request parameter, so only the URLs
# listed here are resolved at all. Leaving it unset keeps CIMD off, and the
# discovery document then reports client_id_metadata_document_supported: false.
#
# Before setting it: fetch the document, confirm its client_id member equals the
# URL and that every redirect_uri is same-origin with it (Claude publishes
# claude.ai and claude.com URLs, which are different registrable domains), and
# note that turning this on makes existing refresh tokens issued to a ti- client
# unusable once Claude switches to the URL client_id.
# CIMD_CLIENT_IDS = "https://claude.ai/api/mcp/client-metadata.json"

# Extra https redirect hosts a self-registered (DCR) client may send an
# authorization code to: whitespace/comma separated bare hostnames, each
# optionally prefixed with "*." for a subdomain suffix. Loopback redirects
# (Claude Code and every other RFC 8252 CLI) are always permitted and never need
# listing. This EXTENDS the built-in defaults in src/oauth/redirect-policy.ts
# (claude.ai, claude.com); it does not replace them, so a forgotten variable
# cannot stop connector registration working.
#
# MANDATORY BEFORE THE FIRST DEPLOY OF THIS CHANGE: list the `client:` keys in
# the production OAUTH_KV namespace and read the redirectUris of every record.
# Any LEGITIMATE client whose redirect is neither loopback nor one of the
# defaults must have its host added here first, or that integration fails at its
# next full interactive authorization (existing access and refresh tokens keep
# working either way). Derive this list from that inventory rather than guessing
# it. A refusal is logged as evt "authorize.redirect_refused" / "dcr.redirect_
# refused" with the rejected origin, so a later surprise is one log read.
# DCR_REDIRECT_HOSTS = "claude.ai claude.com"

[observability]
enabled = true

# Secrets (set via `wrangler secret put` after first deploy):
# GOOGLE_OIDC_CLIENT_SECRET - from ~/.google-oidc-creds
# ADMIN_API_TOKEN          - random 32-byte hex; documented in tasks/admin-api-token.md
